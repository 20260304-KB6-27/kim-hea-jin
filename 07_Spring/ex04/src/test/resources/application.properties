# MySQL 데이터베이스 연결 설정
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/scoula_db?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
jdbc.username=scoula
jdbc.password=1234

# HikariCP 커넥션 풀 상세 설정
# 최대 연결 개수 설정
jdbc.maximumPoolSize=10
# 최소 유휴 연결 개수 설정
jdbc.minimumIdle=5
# 연결 대기 시간 (밀리초 단위, 30초)
jdbc.connectionTimeout=30000
# 연결 최대 유지 시간 (밀리초 단위, 30분)
jdbc.maxLifetime=1800000